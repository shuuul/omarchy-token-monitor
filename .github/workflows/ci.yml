name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Test
        run: make test
      - name: Validate manifest
        run: |
          python3 -c 'import json; json.load(open("manifest.json"))'
          test -f Panel.qml
          test -f Service.qml
